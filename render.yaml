# Render（無料枠）用のデプロイ設定（Blueprint）。
# GitHubにこのリポジトリを置き、Renderで "New +" → "Blueprint" から取り込むと
# Webサービスが作成される。データベースは外部のNeon（無料・期限なし）を使う。
#
# DATABASE_URL は sync: false（Renderのダッシュボードで手動設定）。
# Neonの接続文字列（postgresql://...neon.tech/neondb?sslmode=require）を設定する。
services:
  - type: web
    name: deadline-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true      # Renderが安全なランダム値を自動生成
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECURE
        value: "1"
      - key: DATABASE_URL
        sync: false              # Neonの接続文字列をダッシュボードで手動設定
    # ALLOWED_HOSTS は RENDER_EXTERNAL_HOSTNAME から自動許可（settings.py）
